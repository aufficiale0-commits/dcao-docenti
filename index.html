<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1223">
<title>DCAO · Portale didattico docenti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1223;--pn:#172544;--ln:#2b3c64;--ink:#efe9da;--mute:#9aa8c4;--gold:#d4b062;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 Newsreader,Georgia,serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lab,.tag,#sb small,.stat span,.more{font:600 .68rem/1.3 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
.app{display:flex;min-height:100vh}
#sb{width:270px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding:1.5rem 1rem;background:linear-gradient(#13244a,#0c1830);border-right:1px solid var(--ln);z-index:20}
.logo{display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font-size:1.3rem;margin-left:.6rem}
.bn{font-weight:600;font-size:1.35rem;color:var(--gold);letter-spacing:.14em;margin:.9rem .6rem .2rem}
#sb .lab{color:var(--mute);margin:0 .6rem 1.2rem;padding-bottom:1.2rem;border-bottom:1px solid var(--ln)}
#sb small{display:block;margin:1.4rem .6rem .5rem;color:var(--mute)}
#sb a{display:block;padding:.55rem .8rem;border-radius:10px;text-decoration:none}
#sb a:hover{background:#ffffff0d}
#sb a.on{background:#2a3858;color:var(--gold)}
.mw{flex:1;min-width:0}
.tb{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:.8rem;padding:.8rem clamp(1rem,3vw,2.4rem);background:#0a1223ee;border-bottom:1px solid var(--ln);backdrop-filter:blur(6px)}
#crumb{flex:1;color:var(--mute);font:600 .68rem system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
#se{width:min(280px,40vw);padding:.6rem 1rem;border-radius:99px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);font:inherit;font-size:.95rem}
button,.btn{font:600 .72rem system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:transparent;border:1px solid var(--gold);padding:.55rem .95rem;border-radius:99px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#d4b06226}
.pri,#nx{background:var(--gold);color:#17120a}
#mb{display:none}
main{max-width:1160px;margin:0 auto;padding:clamp(1.5rem,5vw,4rem) clamp(1rem,4vw,3rem) 4rem}
h1,h2{font-weight:400;line-height:1.1;margin:0}
.hero{position:relative;padding-bottom:2rem;border-bottom:1px solid var(--ln)}
.hero .lab{color:var(--gold)}
.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);margin:.8rem 0 1rem}
.hero p{max-width:40rem;color:#cfd6e6;margin:0}
.hero i{position:absolute;right:4%;top:1rem;font-size:5rem;color:var(--gold);opacity:.25;font-style:normal}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.9rem;margin:2rem 0}
.stat,.yc,.lc,.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px}
.stat{padding:1.1rem}
.stat b{display:block;font-size:2rem;font-weight:400;color:var(--gold)}
.stat span{color:var(--mute)}
h2.sec{font-size:1.8rem;margin:2.4rem 0 .3rem}
.sub{color:var(--mute);margin:0 0 1.2rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.yc{display:block;padding:1.4rem;text-decoration:none}
.yc:hover,.lc:hover{border-color:var(--gold)}
.yc em{display:block;font-size:2.6rem;font-style:normal;color:var(--gold);line-height:1}
.yc b{display:block;font-weight:600;font-size:1.3rem;margin:.7rem 0 .2rem}
.yc p{margin:0 0 .9rem;color:var(--mute)}
.more{color:var(--gold)}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem}
.lc{display:flex;flex-direction:column;gap:.35rem;padding:1.1rem;text-decoration:none}
.lc b{font-weight:600;font-size:1.2rem}
.lc span:last-child{color:var(--mute);font-size:.95rem}
.tag{display:inline-block;align-self:flex-start;padding:.25rem .6rem;border-radius:99px;border:1px solid currentColor}
.f{color:#e8b25f}.m{color:#e089a0}.s{color:#ef8a6c}.d{color:#76bde6}.i{color:#b39bf0}.c{color:#7fd0a0}.t{color:#a9b6cf}
.les{max-width:760px}
.les h1{font-size:clamp(2.4rem,6vw,3.6rem);margin:1rem 0 .4rem}
.les .tag{margin-top:1rem}
.ex{margin:1.2rem 0;padding:1rem 1.3rem;border-radius:12px;background:var(--pn);border:1px solid var(--ln)}
.ex b{display:block;font:600 .68rem system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.3rem}
.pg{margin-top:2.2rem;padding-top:.5rem;border-top:1px solid var(--ln)}
.les h3{font-size:1.15rem;font-weight:600;margin:1.2rem 0 .2rem}
.note p{margin:.6rem 0 0!important}
.warn{border-color:#e089a0}.warn b{color:#e089a0}
details{margin:1.5rem 0;color:var(--mute)}summary{cursor:pointer;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin:1.2rem 0 .5rem}
.les h2{font-size:1.6rem;color:var(--gold);margin:2rem 0 .5rem}
.les li{margin:.5rem 0}
blockquote{margin:2rem 0;padding:1.1rem 1.3rem;border-left:3px solid var(--gold);background:#d4b06218;font-size:1.3rem;font-style:italic}
blockquote b{display:block;font:600 .68rem system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;font-style:normal;color:var(--gold);margin-bottom:.3rem}
.note{padding:1rem 1.3rem;border:1px dashed #e089a0;border-radius:12px;margin:2rem 0}
.note h2{margin:0 0 .3rem!important;font-size:1.3rem!important;color:#e089a0!important}
.note p{margin:0}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;color:var(--mute)}
.pn a{text-decoration:none}
.qy{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.5rem}
.qy button{text-transform:none;letter-spacing:0;font:600 .95rem Newsreader,serif;color:var(--ink);border-color:var(--ln);background:var(--pn)}
.qy button:hover{border-color:var(--gold)}
.qy .pri{color:#17120a;border-color:var(--gold)}
.card{max-width:700px;padding:1.6rem}
.card h2{font-size:1.7rem;margin:.4rem 0 1.2rem}
.prog{color:var(--mute);margin:0}
.opts{display:grid;gap:.6rem}
.opt{text-align:left;text-transform:none;letter-spacing:0;font:400 1.05rem Newsreader,serif;color:var(--ink);border-radius:12px;border-color:var(--ln);padding:.8rem 1rem}
.opt.ok{border-color:#7fd0a0;background:#7fd0a026}
.opt.no{border-color:#e089a0;background:#e089a026;text-decoration:line-through}
#fb{min-height:1.6rem;margin:1rem 0 .5rem}
@media(max-width:860px){
#sb{position:fixed;left:-290px;transition:left .2s}
body.open #sb{left:0}
#mb{display:inline-block}
.hero i{display:none}
}
@media(prefers-reduced-motion:reduce){#sb{transition:none}}
</style>
</head>

<script>
/* [anno, titolo, sottotitolo, punti, gesto|0, da ricordare, nota docente, domande[domanda, giusta, sbagliata, sbagliata]] */
const D=[
[1,"Fattura, maleficio e maledizione","Tre categorie di magia ostile",
["Fattura: cambia per poco il comportamento o la condizione del bersaglio (risate, movimenti involontari, confusione).","Maleficio: limita, ostacola o danneggia; può bloccare i movimenti o rendere ostile l’ambiente.","Maledizione: atto più grave, pensato per causare sofferenza, assoggettamento o danni difficili da annullare.","Una fattura diventa abuso se umilia chi non può difendersi."],0,
"Per distinguerle guarda intenzione, conseguenze e contesto.",
"Esempi: risata incontrollata (fattura), passaggio bloccato vicino a una scala (maleficio). Le Maledizioni Senza Perdono restano solo teoria, negli anni avanzati.",
[["Quale categoria è la più grave?","La maledizione","La fattura","Il maleficio"],["Cosa distingue le tre categorie?","Intenzione, conseguenze e contesto","Il colore della bacchetta","La lunghezza della formula"],["Quando una fattura diventa abuso?","Quando umilia chi non può difendersi","Quando fa ridere","Quando dura pochi secondi"]]],
[1,"La scelta più importante","Valutare il pericolo prima di lanciare un sortilegio",
["Tre domande: qual è il pericolo immediato? Chi può essere colpito indirettamente? Quale risposta ferma il pericolo col minor danno?","Se provocati, scegli un incantesimo che interrompa l’azione senza ferire.","Se un incantesimo parte per errore, metti al sicuro tutti i presenti.","La ricerca del responsabile viene dopo la sicurezza."],0,
"La magia si usa con responsabilità, prudenza e consapevolezza.",
"Fai immaginare un conflitto e chiedi la risposta meno dannosa: l’obiettivo è proteggere, non vendicarsi.",
[["Prima cosa da fare se un incantesimo parte per errore?","Mettere al sicuro i presenti","Cercare il colpevole","Lanciare un secondo incantesimo"],["Cosa si preferisce se si è provocati?","Un incantesimo che interrompe senza ferire","Il più potente","Il più rapido"],["Cosa viene dopo la sicurezza?","La ricerca del responsabile","La vendetta","Il silenzio"]]],
[1,"Rictusempra","Incantesimo delle Risate · Fattura",
["Provoca un solletico improvviso e intenso: il bersaglio ride, perde la concentrazione e può cadere.","Serve a distrarre, interrompere la preparazione di un incantesimo o guadagnare tempo.","Riuscita: precisione dell’esecuzione e resistenza del bersaglio.","Quasi innocuo, ma pericoloso vicino a ostacoli o scale."],
["Punta la bacchetta sul bersaglio.","Breve movimento orizzontale da sinistra a destra.","Piccolo scatto in avanti con la punta.","Pronuncia «Rictusempra!»"],
"Distrae attraverso il riso e interrompe l’azione per un momento.",
"Chiarisci che non serve a ferire. Mostra il gesto al rallentatore senza lanciare, poi fai ripetere la formula alla classe.",
[["Effetto principale di Rictusempra?","Solletico incontrollabile e risate","Paralisi temporanea","Scudo protettivo"],["Perché è utile in duello?","Interrompe la concentrazione dell’avversario","Rende invisibili","Annulla ogni incantesimo"],["Rischio di usarlo troppo presto?","Perdere un’occasione migliore per interrompere l’avversario","Esaurire la magia","Rendere l’effetto permanente"],["Quale elemento è fondamentale per eseguire correttamente un incantesimo?","La concentrazione e la corretta esecuzione","La velocità nel correre","Il colore della bacchetta"],["Un avversario mantiene la concentrazione nonostante Rictusempra. Cosa dimostra?","Che gli effetti possono essere contrastati o gestiti","Che l’incantesimo è sempre inutile","Che l’avversario è invisibile"]]],
[1,"Flipendo","Maleficio Respingente",
["Dà al bersaglio una spinta concentrata: indietreggia o perde l’equilibrio.","La distanza dipende da resistenza, potenza magica e spazio disponibile.","Spinta e schianto non sono la stessa cosa: lo schianto può essere violento.","A scuola si usa su bersagli fissi o manichini imbottiti; controlla cosa c’è alle spalle del bersaglio."],
["Punta all’altezza del petto.","Traccia una breve linea in avanti.","Scatto netto del polso verso il bersaglio.","Pronuncia «Flipendo!»"],
"Serve a creare distanza: la spinta va controllata.",
"Spiega la differenza tra spinta e schianto con un bersaglio davanti a una parete o a una scala.",
[["A cosa serve Flipendo?","A creare distanza con una spinta controllata","A immobilizzare","A illuminare"],["Cosa controllare prima di lanciarlo?","Ciò che sta dietro al bersaglio","Il colore del mantello","L’ora"],["Il gesto di Flipendo è…","Breve e deciso","Ampio e circolare","Lento e continuo"]]],
[1,"Protego","Incantesimo di Protezione",
["Crea una barriera magica blu intenso che respinge o devia molti incantesimi.","Riuscita: concentrazione, prontezza e abilità.","Uno scudo debole può infrangersi contro un incantesimo molto potente.","Non è mai una garanzia assoluta."],
["Impugna saldamente la bacchetta davanti al corpo.","Solleva la punta, breve e deciso, dal basso verso l’alto.","Pronuncia «Protego!»"],
"Una barriera efficace chiede concentrazione, prontezza e controllo.",
"Il gesto è quello di alzare uno scudo: rapido, ma non esagerato.",
[["Cosa fa Protego?","Crea una barriera che respinge o devia incantesimi","Disarma","Rende invisibili"],["Protego è invulnerabile?","No: dipende da chi lo lancia e dalla forza avversaria","Sì, sempre","Solo di notte"],["Il movimento di Protego va…","Dal basso verso l’alto","Da destra a sinistra","In cerchio"]]],
[2,"Il Molliccio","Boggart · la creatura che imita la paura",
["Assume la forma della paura dominante di chi ha davanti: persone diverse vedono forme diverse.","Si nasconde in armadi, cassapanche e stipi mai aperti.","Indizi: luogo, contenitore, cambiamenti improvvisi. Una forma gigantesca non implica forza reale.","In gruppo fatica a scegliere la forma, ma nessuno è al riparo: osserva i compagni e non deridere le loro paure."],0,
"Il Molliccio trasforma la paura in un’immagine concreta.",
"Chiedi perché la stessa presenza appaia diversa a persone diverse. Insisti sul rispetto delle paure altrui.",
[["Dove si nasconde di solito?","In armadi e ripostigli poco usati","Nei laghi","Nei camini accesi"],["Perché il gruppo aiuta?","Il Molliccio fatica a scegliere una paura","Lo rende più debole fisicamente","Non aiuta affatto"],["Come ci si comporta con la paura altrui?","Con rispetto, senza deridere","Facendola notare a tutti","Ignorandola"]]],
[2,"Riddikulus","Incantesimo Anti-Molliccio",
["Trasforma la forma del Molliccio in qualcosa di buffo, grottesco o meno minaccioso.","Serve un’immagine mentale concreta: un cappello enorme, scarpe giganti, un’andatura goffa.","Il riso sincero indebolisce la creatura.","Non cancella i ricordi né ogni paura."],
["Punta la bacchetta sul Molliccio.","Piccolo semicerchio dal basso verso destra.","Scatto leggero verso l’alto.","Pronuncia «Riddikulus!» visualizzando la trasformazione."],
"Gesto controllato e immagine mentale precisa lavorano insieme.",
"Idee vaghe non bastano. Evita gesti concitati: è la mente a guidare il cambiamento.",
[["Cosa fa Riddikulus?","Rende ridicola la forma del Molliccio","Lo uccide","Lo rende invisibile"],["Cosa rende efficace l’incantesimo?","Un’immagine mentale precisa","La forza fisica","L’urlo"],["Riddikulus cancella la paura?","No, cambia solo la forma","Sì, per sempre","Solo i ricordi"]]],
[2,"Colloshoo","Incantesimo Incollante",
["Fa aderire al suolo le calzature del bersaglio, ostacolandone il passo.","Rallenta un inseguitore, ma non blocca braccia, sguardo né bacchetta.","L’effetto varia su terreno cedevole o senza calzature adatte.","In aula si prova su una scarpa vuota fissata a una tavoletta."],
["Individua la base della calzatura.","Piccolo uncino verso il basso.","Ferma il gesto, come per fissare un punto a terra.","Pronuncia «Colloshoo!»"],
"Limita il movimento, ma non immobilizza del tutto. Mai su chi sta correndo: può cadere.",
"Evidenzia il pericolo di un arresto improvviso su scale, passerelle o vicino alle uscite.",
[["Su cosa agisce?","Sulle calzature del bersaglio","Sulle braccia","Sulla voce"],["Il bersaglio può ancora usare la bacchetta?","Sì","No, mai","Solo con la sinistra"],["Perché non usarlo su chi corre?","Un arresto improvviso può farlo cadere","Non funzionerebbe","Si romperebbe la bacchetta"]]],
[2,"Verdimillus","Lampo di energia verdastra",
["Un breve lampo verdastro che disturba l’avversario e rischiara un passaggio in penombra.","Può mettere in evidenza elementi nascosti da un occultamento, ma non scioglie ogni incantesimo oscuro.","Una luce troppo intensa può danneggiare la vista, anche degli alleati.","In aula si indirizza su pannelli opachi e spazi oscurati."],
["Piccolo arco laterale con la bacchetta.","Concludi puntando in avanti.","Pronuncia «Verdimillus!» al termine dell’arco."],
"La luce aiuta a vedere, ma non sostituisce la prudenza.",
"Distingui rendere visibile un dettaglio da avere la certezza che un luogo sia sicuro.",
[["Cosa produce Verdimillus?","Un breve lampo verdastro","Un muro di fuoco","Un’ombra"],["Scioglie ogni magia di occultamento?","No, un segreto ben protetto può restare celato","Sì, sempre","Solo i mantelli"],["Se un oggetto brilla, il luogo è sicuro?","No, va esaminato con prudenza","Sì","Dipende dal colore"]]],
[2,"Riepilogo del primo e secondo anno","Le idee essenziali dei primi due anni",[],0,"La conoscenza della magia deve sempre accompagnarsi a prudenza e responsabilità.","",[["Quale incantesimo trasforma la forma del Molliccio?", "Riddikulus", "Protego", "Flipendo"], ["Quale incantesimo serve a respingere o deviare un attacco?", "Protego", "Colloshoo", "Verdimillus"], ["Quale incantesimo fa aderire le scarpe al suolo?", "Colloshoo", "Rictusempra", "Riddikulus"]]],
[3,"Come affrontare queste lezioni","Osservare, comprendere e scegliere la risposta più prudente",[],0,"La conoscenza serve a prevenire il pericolo, non a cercarlo.","",[["Cosa si fa davanti a una creatura pericolosa?", "Si riconoscono i segnali senza avvicinarsi inutilmente", "Ci si avvicina per verificare", "Si prova subito a combatterla"], ["Cosa viene prima del confronto?", "La sicurezza", "Il coraggio", "La velocità"], ["A cosa serve la conoscenza?", "A prevenire il pericolo, non a cercarlo", "A sfidare gli avversari", "A umiliare gli altri"]]],
[3,"I troll","Forza, territorio e vie di fuga",
["Enorme forza e temperamento difficile; varietà di montagna, foresta e fiume.","La goffaggine inganna: può essere rapido e sollevare pesi notevoli.","Segnali: impronte profonde, tronchi abbattuti, trascinamenti, odori forti. Nessuno è prova assoluta da solo.","In uno spazio stretto controlla uscite e ostacoli; non provocarlo con luci o oggetti; niente incantesimi esplosivi vicino a strutture portanti.","Non separarti dal gruppo, segnala il pericolo e segui i docenti."],0,
"Un troll non è un bersaglio d’esercitazione: la lezione insegna a evitare lo scontro.",
"Usa l’esempio del corridoio stretto. Chi cade va aiutato senza creare una seconda vittima.",
[["Prima scelta davanti a un troll?","Controllare le uscite e mettere al sicuro il gruppo","Provocarlo con una luce","Affrontarlo da solo"],["Un troll goffo è lento?","Non necessariamente: può muoversi in fretta","Sì, sempre","Solo di giorno"],["Quale segnale indica la sua presenza?","Impronte molto profonde","Fiori appassiti","Nebbia leggera"]]],
[3,"Tarantallegra","Incantesimo Danzante · Fattura",
["Costringe il bersaglio a muovere rapidamente le gambe come in una danza incontrollabile.","Non è una coreografia volontaria: nasce da una costrizione magica.","In duello fa perdere stabilità e può interrompere un incantesimo.","Pericolosa su scale, balconi e pavimenti sconnessi."],
["Punta la bacchetta sulle gambe del bersaglio.","Due brevi oscillazioni alternate, destra e sinistra.","Pronuncia «Tarantallegra!»","Dai ritmo al gesto, senza ampi mulinelli."],
"Un incantesimo che impone movimenti va interrotto se il bersaglio perde l’equilibrio.",
"Non va usato per deridere. Mostra le due oscillazioni lentamente.",
[["Cosa provoca?","Movimento incontrollato delle gambe","Cecità","Sonno"],["Dove è più pericolosa?","Su scale e balconi","Su un prato","In un lago"],["Quando va interrotta?","Quando il bersaglio perde l’equilibrio","Mai","Dopo un’ora"]]],
[3,"Expelliarmus","Incantesimo di Disarmo",
["Fa lasciare al bersaglio la bacchetta o l’oggetto che impugna.","Può interrompere un attacco, ma il disarmo non è sempre assicurato (distanza, presa, concentrazione, ostacoli).","Disarmare non mette in sicurezza il luogo: il bersaglio può ancora muoversi o parlare.","Mira alla bacchetta, non al volto, e osserva dove cade."],
["Solleva la bacchetta verso la mano armata.","Breve scatto diagonale verso l’alto.","Pronuncia «Expelliarmus!» al termine."],
"Il successo si misura dal controllo della situazione, non dalla violenza del lancio.",
"La bacchetta non deve finire nel fuoco, vicino a un precipizio o in mani sbagliate.",
[["Scopo di Expelliarmus?","Far lasciare la bacchetta all’avversario","Immobilizzarlo","Confonderlo"],["Disarmare rende innocuo l’avversario?","No","Sì, sempre","Solo se ride"],["Dove si mira?","Alla bacchetta","Al volto","Ai piedi"]]],
[3,"Evertestatum","Incantesimo di Dispersione · Schiantesimo",
["Una forza che fa inciampare o scaraventa all’indietro il bersaglio.","Più brusco di Flipendo, con perdita di equilibrio meno graduale.","Può aprire una via di fuga, ma la caduta può causare lesioni.","Valuta il punto d’arrivo, non solo la distanza percorsa."],
["Linea breve in diagonale dal basso verso l’alto.","Spinta in avanti della punta.","Pronuncia «Evertestatum!» in un solo tempo deciso.","Evita vetri, parapetti, pareti fragili e luoghi affollati."],
"In un luogo affollato è meglio una difesa meno invasiva.",
"Confrontalo con Flipendo. Nel corso la grafia è «Evertestatum» (nei repertori «Everte Statum»).",

[4,"I licantropi","Una condizione, non una scelta",
["Condizione magica trasmessa dal morso di un lupo mannaro in trasformazione.","Quasi sempre la persona ha aspetto umano, memoria e relazioni: ha diritti e dignità.","Il rischio è la luna piena, quando si perde il normale controllo.","Nessun segno fisico certo: stanchezza o cicatrici non provano nulla.","Emergenza: allontanarsi in gruppo, evitare spazi chiusi, avvisare il personale. Non trattenere la creatura né restare per coraggio."],0,
"La conoscenza protegge dal pericolo e dai pregiudizi verso la persona.",
"Distingui condizione e responsabilità morale. Nel 1890 non si presume una pozione comune che cancelli i rischi mentali.",
[["Come si trasmette?","Dal morso di un lupo mannaro trasformato","Dal tocco","Da un incantesimo"],["Un segno fisico identifica un licantropo?","No, non esiste un segno certo","Sì, le cicatrici","Sì, la stanchezza"],["In caso di trasformazione inattesa?","Allontanarsi in gruppo e avvisare il personale","Trattenerlo","Discutere con lui"]]],
[4,"Le Acromantule","Colonie, veleno e prudenza",
["Enormi ragni magici, capaci di linguaggio e ragionamento; origine nel Sud-est asiatico.","Saper parlare non significa essere amichevoli.","Vivono in colonie: reti estese, fili robusti, resti di prede. Torna indietro senza rompere le trame.","Mandibole e veleno: una ferita va ai guaritori. Niente rimedi improvvisati, né raccolta di veleno, né cattura.","Se l’incontro è inevitabile: via di ritirata, mai nidi o uova, proteggi i più vulnerabili. Luci ed esplosioni li irritano."],0,
"Una creatura pericolosa non è automaticamente malvagia, ma la prudenza resta indispensabile.",
"Fai ragionare la classe sull’effetto di una luce o di un’esplosione vicino alla colonia.",
[["Segno di una colonia?","Reti estese e fili robusti fra gli alberi","Canti","Fiori"],["Se una colonia accerchia il gruppo?","Allontanare i più vulnerabili e chiedere aiuto","Provocarla","Raccogliere veleno"],["Saper parlare rende amichevoli?","No","Sì","Sempre"]]],
[4,"Confundo","Incantesimo Confundus · Fattura",

[4,"Petrificus","Incantesimo Pietrificante · Fattura",
["Irrigidisce il corpo e limita o impedisce i movimenti; la durata dipende dalla riuscita.","Il bersaglio può restare cosciente e sensibile: usarlo per scherzo è crudele.","Può lasciare la persona incapace di proteggersi da una caduta.","Sciogli l’effetto in fretta, soprattutto se la posizione è scomoda."],

"Fattura, maleficio e maledizione":["Sono tre tipi di magia ostile. La fattura è un fastidio che passa presto. Il maleficio ostacola o fa male. La maledizione è la più grave e i suoi effetti durano.","Un compagno ti fa ridere senza controllo: è una fattura. Ti blocca il passaggio vicino alle scale: è un maleficio. Ti lascia una sofferenza che non passa: è una maledizione.","Anche una fattura può far male se colpisci chi non può difendersi o se siamo in un posto pericoloso.","Racconta tre situazioni e chiedi alla classe: fattura, maleficio o maledizione? Perché?"],
"La scelta più importante":["Prima di lanciare un incantesimo ci si ferma un attimo: cosa sta succedendo davvero? Come faccio meno danni possibile?","Due studenti litigano in corridoio e uno estrae la bacchetta. Invece di colpire forte, scegli un incantesimo che ferma l’azione senza ferire.","Non cercare il colpevole mentre c’è ancora pericolo: prima si mettono al sicuro tutti.","Descrivi un litigio e fai scegliere a ogni studente la risposta meno dannosa, spiegando perché."],
"Rictusempra":["Fa venire un solletico fortissimo: il bersaglio ride, non riesce più a concentrarsi e può cadere.","Un avversario sta preparando un incantesimo: lo colpisci, scoppia a ridere e perde il filo.","Sembra innocuo, ma vicino a scale o spigoli una caduta fa male.","In coppie, ripetete il gesto senza lanciare e dite la formula a voce chiara."],
"Flipendo":["Dà una spinta al bersaglio e lo fa indietreggiare. Serve a creare distanza, non a far male.","Un avversario ti è troppo vicino: lo spingi indietro di un passo e guadagni spazio.","Guarda cosa c’è dietro di lui: una parete o una scala trasformano la spinta in uno schianto.","Usa un manichino imbottito e confronta una spinta leggera con una forte."],
"Protego":["Crea uno scudo magico blu davanti a te che respinge o devia molti incantesimi.","Ti lanciano una fattura: alzi lo scudo e l’incantesimo rimbalza via.","Lo scudo non è invincibile: un incantesimo molto forte può romperlo.","Uno studente alza lo scudo mentre il professore indica un colpo immaginario."],
"Il Molliccio":["È una creatura che si trasforma in ciò che ti fa più paura. Persone diverse vedono cose diverse.","Apri un vecchio armadio e ne esce una paura. Un compagno, davanti allo stesso armadio, ne vede un’altra.","Non ridere delle paure degli altri: quello che a te sembra buffo per qualcuno è serio.","Usate paure di fantasia, senza forzare nessuno, e cercate gli indizi per riconoscere il Molliccio."],
"Riddikulus":["È l’incantesimo contro il Molliccio: trasforma la forma spaventosa in qualcosa di buffo.","Il Molliccio ha la forma di un mostro: immagini scarpe enormi ai suoi piedi, lanci l’incantesimo e inciampa.","Serve un’immagine precisa nella mente: «qualcosa di buffo» non basta.","Ogni studente sceglie una trasformazione buffa e la descrive prima di lanciare."],
"Colloshoo":["Incolla le scarpe del bersaglio al pavimento, così fa fatica a muoversi.","Un inseguitore ti corre dietro: lo colpisci e resta fermo con le scarpe incollate.","Non usarlo su chi sta correndo: l’arresto improvviso può farlo cadere.","Si prova su una scarpa vuota fissata a una tavoletta."],
"Verdimillus":["Manda un breve lampo di luce verde. Illumina il buio e può far vedere cose nascoste.","Entri in un corridoio buio: il lampo mostra una porta nascosta nel muro.","Una luce troppo forte fa male agli occhi, anche degli amici. E se qualcosa brilla, non vuol dire che sia sicuro.","Lanciatelo verso un pannello opaco in una stanza buia e guardate cosa si vede."],
"I troll":["Creature enormi, fortissime e territoriali. Sono più veloci di quanto sembrano.","Nel bosco trovi tronchi spezzati e impronte profonde: c’è un troll. Si torna indietro tutti insieme.","Non si combatte e non si provoca: si cercano le uscite e si avvisano i docenti.","Disegna un corridoio alla lavagna e chiedi dove sono le uscite e cosa NON fare."],
"Tarantallegra":["Costringe le gambe del bersaglio a muoversi da sole, come in una danza che non riesce a fermare.","In duello l’avversario non sta più fermo e perde l’equilibrio.","Pericolosa su scale e balconi. Se il bersaglio cade, va fermata subito.","Mostra le due oscillazioni lentamente e fai ripetere ritmo e formula."],
"Expelliarmus":["Fa volare via la bacchetta dalla mano dell’avversario.","L’avversario sta per attaccare: la sua bacchetta vola via e l’attacco si ferma.","Disarmare non vuol dire che il pericolo è finito. E guarda dove cade la bacchetta.","In coppie, uno finge di impugnare la bacchetta e l’altro esegue il gesto senza lanciare."],
"Evertestatum":["È una spinta brusca che fa inciampare o cadere all’indietro. Più forte di Flipendo.","Ti inseguono e il corridoio è libero: chi ti segue cade e hai tempo di scappare.","Evita vetri, parapetti e luoghi affollati: la caduta può far male.","Chiedi alla classe: Flipendo o Evertestatum in una sala piena di gente? Perché?"],
"I licantropi":["Sono persone che con la luna piena si trasformano in lupo. Per il resto del tempo sono persone normali.","Un compagno è spesso stanco e ha qualche cicatrice: non vuol dire nulla e non si accusa nessuno.","Il pericolo è la trasformazione, non la persona. Mai accuse senza prove.","Chiedi cosa fare se la sera si sente un ululato: allontanarsi in gruppo e avvisare."],
"Le Acromantule":["Sono ragni giganti che parlano e ragionano. Vivono in colonie e il loro veleno è pericoloso.","Vedi grandi ragnatele tra gli alberi: è un nido. Torni indietro piano, senza toccare i fili.","Anche se parlano, non sono amiche. Mai avvicinarsi a nidi e uova.","Mostra i segnali di una colonia e chiedi qual è la via di ritirata migliore."],
"Confundo":["Confonde per un po’ la mente del bersaglio: non capisce più cosa stava facendo.","L’avversario sta per lanciare un incantesimo e, confuso, sbaglia direzione.","Non si usa per ingannare qualcuno in un accordo o a un esame: tradisce la fiducia.","Discutete: qual è la differenza tra convincere qualcuno con le parole e confonderlo con la magia?"],
"Petrificus":["Irrigidisce il corpo del bersaglio e lo blocca.","Un avversario ti sta aggredendo: lo blocchi e puoi metterlo in sicurezza.","Chi è bloccato non può proteggersi: non lasciarlo in pericolo e scioglilo in fretta.","Dopo la dimostrazione chiedi: cosa fai subito dopo aver bloccato qualcuno?"]
};
const P={"Fattura, maleficio e maledizione": [{"t": "Fattura, maleficio e maledizione", "s": "Tre categorie di magia ostile, distinte per intenzione, gravità ed effetti.", "c": [{"h": "Definizione e caratteristiche", "i": ["Fattura: modifica temporaneamente il comportamento o la condizione del bersaglio; può provocare risate, movimenti involontari o confusione.", "Maleficio: mira a limitare, ostacolare o danneggiare; può bloccare i movimenti o rendere ostile l’ambiente.", "Maledizione: atto ostile generalmente più grave, progettato per causare sofferenza, assoggettamento o conseguenze difficili da annullare."], "o": false}, {"h": "Esempio / attenzione", "i": ["Una fattura può diventare abuso se umilia qualcuno che non può difendersi.", "Un impedimento apparentemente semplice può essere grave in un luogo pericoloso.", "La gravità non dipende soltanto dalla presenza di ferite visibili."], "o": false}], "r": "Per distinguere le categorie bisogna osservare intenzione, conseguenze e contesto.", "l": "Da ricordare", "n": "Spiega le tre definizioni in sequenza. Per la fattura usa l’esempio di una risata incontrollata; per il maleficio, quello di un passaggio bloccato vicino a una scala; per la maledizione, sottolinea la maggiore gravità e la possibilità di conseguenze durature. Ricorda che le tre Maledizioni Senza Perdono rappresentano il limite estremo e vengono affrontate solo teoricamente negli anni avanzati."}], "La scelta più importante": [{"t": "La scelta più importante", "s": "Prima di reagire con un sortilegio, valutare il pericolo e le possibili conseguenze.", "c": [{"h": "Tre domande da porsi", "i": ["Qual è il pericolo immediato?", "Chi potrebbe essere colpito indirettamente?", "Quale risposta arresta il pericolo con il minor danno possibile?"], "o": false}, {"h": "Come comportarsi", "i": ["Se provocati, preferire un incantesimo che interrompa l’azione senza ferire.", "Se un incantesimo parte per errore, mettere prima al sicuro tutti i presenti.", "La ricerca di un responsabile viene dopo la sicurezza."], "o": false}], "r": "La magia va usata con responsabilità, prudenza e consapevolezza.", "l": "Da ricordare", "n": "Invita gli studenti a immaginare una situazione di conflitto. Chiedi loro quale sarebbe la risposta meno dannosa. Insisti sul fatto che il primo obiettivo è mettere in sicurezza le persone, non punire o vendicarsi."}], "Rictusempra": [{"t": "Rictusempra – Utilizzo Fattura", "s": "Incantesimo delle Risate", "c": [{"h": "Definizione ed effetto", "i": ["Rictusempra è una fattura che provoca un solletico improvviso e particolarmente intenso.", "Il bersaglio ride, perde la concentrazione e può cadere a terra.", "È usata per distrarre un avversario, interrompere la preparazione di un incantesimo o guadagnare tempo per difendersi."], "o": false}, {"h": "Efficacia e prudenza", "i": ["La riuscita dipende dalla precisione dell’esecuzione e dalla capacità del bersaglio di resistere.", "È considerata relativamente innocua, ma può avere conseguenze indesiderate in situazioni pericolose."], "o": false}], "r": "Rictusempra distrae attraverso il riso e interrompe temporaneamente l’azione.", "l": "Da ricordare", "n": "Leggi la definizione e chiarisci che non è un incantesimo pensato per ferire: il suo scopo è distrarre. Fai notare però che una persona che ride o perde l’equilibrio può farsi male se si trova vicino a ostacoli o scale."}, {"t": "Rictusempra – Movimento della bacchetta", "s": "Il gesto deve essere breve, preciso e accompagnato dalla pronuncia.", "c": [{"h": "Sequenza del gesto", "i": ["Puntare la bacchetta verso il bersaglio.", "Eseguire un breve movimento orizzontale da sinistra verso destra.", "Aggiungere un piccolo scatto in avanti con la punta.", "Pronunciare chiaramente «Rictusempra!»."], "o": true}, {"h": "Concentrazione", "i": ["Concentrarsi sull’intenzione di provocare il solletico.", "Mantenere la bacchetta orientata verso il bersaglio fino al completamento.", "Evitare movimenti ampi o imprecisi."], "o": false}], "r": "Precisione, pronuncia e concentrazione guidano l’esecuzione.", "l": "Da ricordare", "n": "Descrivi il movimento in quattro passaggi. Puoi mostrarlo lentamente senza lanciare l’incantesimo: prima il tratto orizzontale, poi il piccolo scatto in avanti. Fai ripetere la pronuncia alla classe."}], "Flipendo": [{"t": "Flipendo – Utilizzo schiantesismo", "s": "Maleficio Respingente", "c": [{"h": "Definizione ed effetto", "i": ["Flipendo trasferisce al bersaglio una spinta concentrata.", "Può farlo indietreggiare o perdere l’equilibrio.", "La distanza dipende dalla resistenza del bersaglio, dalla potenza magica e dallo spazio disponibile.", "A scuola si pratica su bersagli fissi o manichini imbottiti."], "o": false}, {"h": "Distinzione e sicurezza", "i": ["Una spinta allontana; uno schianto può produrre un impatto violento.", "Prima di usarlo, controllare ciò che si trova alle spalle del bersaglio.", "Quando basta creare distanza, preferire l’effetto più controllato."], "o": false}], "r": "Flipendo serve a creare distanza: la spinta deve essere controllata.", "l": "Da ricordare", "n": "Spiega la differenza tra spinta e schianto. Usa l’esempio del bersaglio davanti a una parete o vicino a una scala: l’effetto non va valutato da solo, ma in relazione allo spazio circostante."}, {"t": "Flipendo – Movimento della bacchetta", "s": "Un gesto breve e deciso, senza prolungare la spinta.", "c": [{"h": "Sequenza del gesto", "i": ["Portare la punta della bacchetta all’altezza del petto.", "Tracciare una breve linea in avanti.", "Terminare con uno scatto netto del polso verso il bersaglio.", "Pronunciare «Flipendo!»."], "o": true}, {"h": "Concentrazione", "i": ["Immaginare una spinta breve e precisa.", "Non pensare a una scarica continua.", "Controllare la direzione del movimento."], "o": false}], "r": "Un gesto breve e deciso produce una spinta controllata.", "l": "Da ricordare", "n": "Mostra il movimento lentamente. Evidenzia che la linea in avanti è breve e che il gesto termina con lo scatto del polso. La qualità del movimento conta più della sua ampiezza."}], "Protego": [{"t": "Protego – Utilizzo Incantesimo Difensivo", "s": "Incantesimo di Protezione", "c": [{"h": "Definizione ed effetto", "i": ["Protego è un incantesimo difensivo che genera una barriera magica, descritta come bluastro-intensa.", "Lo scudo può respingere o deviare numerosi incantesimi e proteggere dagli attacchi diretti.", "La sua riuscita dipende da concentrazione, prontezza e abilità."], "o": false}, {"h": "Limiti della protezione", "i": ["Uno scudo debole può infrangersi contro un incantesimo particolarmente potente.", "Una protezione ben eseguita può respingere quasi ogni attacco.", "La difesa non va considerata una garanzia assoluta."], "o": false}], "r": "Una barriera efficace richiede concentrazione, prontezza e controllo.", "l": "Da ricordare", "n": "Presenta Protego come una delle principali forme di difesa. Chiarisci che lo scudo può deviare molti attacchi, ma non è invulnerabile: la sua efficacia dipende da chi lo esegue e dalla forza dell’incantesimo avversario."}, {"t": "Protego – Movimento della bacchetta", "s": "Il gesto richiama il movimento con cui si solleva uno scudo.", "c": [{"h": "Sequenza del gesto", "i": ["Impugnare saldamente la bacchetta davanti al corpo.", "Sollevare la punta con un movimento breve e deciso dal basso verso l’alto.", "Pronunciare chiaramente «Protego!»."], "o": true}, {"h": "Concentrazione", "i": ["Immaginare una barriera tra sé e ciò che si vuole respingere.", "Mantenere un movimento fluido, senza gesti troppo ampi.", "La rapidità è importante, ma il controllo migliora il risultato."], "o": false}], "r": "Rapidità e controllo aiutano a creare una barriera efficace.", "l": "Da ricordare", "n": "Spiega il gesto come se si alzasse uno scudo davanti al corpo. Mostra che il movimento deve essere rapido ma non esagerato. Invita gli studenti a concentrarsi sull’idea di protezione."}], "Il Molliccio": [{"t": "Il Molliccio e il potere della paura", "s": "Riconoscere una creatura che assume la forma di ciò che temiamo.", "c": [{"h": "Definizione", "i": ["Il Molliccio, chiamato anche Boggart in numerosi trattati britannici, è una creatura che assume la forma della paura dominante di chi gli sta davanti.", "Non esiste una descrizione unica del suo aspetto: persone diverse possono vedere forme diverse."], "o": false}, {"h": "Obiettivo della lezione", "i": ["Riconoscere gli indizi della sua presenza.", "Capire come sfrutta la reazione iniziale alla paura.", "Imparare a osservare senza lasciarsi guidare dalla sorpresa."], "o": false}], "r": "Il Molliccio trasforma la paura in un’immagine concreta.", "l": "Da ricordare", "n": "Introduci la creatura chiedendo agli studenti perché la stessa presenza possa apparire diversa a persone diverse. Anticipa che il Molliccio non va riconosciuto soltanto dalla forma, ma anche dal luogo in cui si nasconde e dai cambiamenti che manifesta."}, {"t": "Un essere che preferisce nascondersi", "s": "Il Molliccio ama i luoghi chiusi e appartati.", "c": [{"h": "Dove si nasconde", "i": ["Si trova spesso in armadi, cassapanche, stipi mai aperti e ripostigli poco frequentati.", "Nessuno conosce con certezza il suo aspetto quando non viene osservato."], "o": false}, {"h": "La sua capacità", "i": ["Assume la forma della paura dominante di chi gli sta davanti.", "Due persone possono descrivere la stessa creatura in modi completamente diversi.", "Non deve inseguire fisicamente una vittima: gli basta mostrarle un’immagine minacciosa."], "o": false}], "r": "Il Molliccio sfrutta ciò che la mente riconosce come minaccioso.", "l": "Da ricordare", "n": "Sottolinea che il Molliccio preferisce nascondersi e che la sua caratteristica più importante è la trasformazione. Spiega che la creatura agisce sulla percezione: non deve inseguire la persona, perché è sufficiente presentarle la sua paura."}, {"t": "Come riconoscerlo", "s": "Non bisogna fermarsi alla prima impressione.", "c": [{"h": "La forma può ingannare", "i": ["Il Molliccio imita una figura, ma non ne possiede necessariamente tutte le caratteristiche.", "Una forma gigantesca non implica una forza reale.", "Un volto familiare non significa che quella persona sia davvero presente."], "o": false}, {"h": "Indizi da osservare", "i": ["Il luogo da cui è uscito.", "Il contenitore in cui si nascondeva.", "I cambiamenti improvvisi della figura."], "o": false}], "r": "Osservare il contesto aiuta a riconoscere il Molliccio.", "l": "Da ricordare", "n": "Invita gli studenti a non confondere l’aspetto con le capacità reali. Una forma spaventosa può essere soltanto un’imitazione. Gli indizi più utili sono il contenitore, il luogo e i cambiamenti improvvisi della figura."}, {"t": "Perché lavorare insieme aiuta", "s": "La presenza di più persone può rendere più difficile la scelta della forma.", "c": [{"h": "Davanti a un gruppo", "i": ["Il Molliccio può avere difficoltà a decidere quale paura riprodurre.", "Il gruppo non è completamente al riparo dall’agitazione.", "È importante non isolarsi e osservare i compagni."], "o": false}, {"h": "Rispetto e comprensione", "i": ["Non deridere le reazioni degli altri.", "Una paura che sembra ridicola a qualcuno può essere molto seria per chi la prova.", "La curiosità deve accompagnarsi al rispetto."], "o": false}], "r": "La collaborazione aiuta, ma il rispetto delle paure altrui è essenziale.", "l": "Da ricordare", "n": "Spiega che il gruppo può mettere in difficoltà il Molliccio, ma non elimina ogni rischio. Soprattutto, richiama il rispetto: ciò che fa sorridere una persona può essere davvero spaventoso per un’altra."}], "Riddikulus": [{"t": "Riddikulus", "s": "Incantesimo Anti-Molliccio", "c": [{"h": "Definizione", "i": ["Riddikulus agisce sulla forma assunta dal Molliccio e la trasforma in qualcosa di divertente, grottesco o meno minaccioso.", "La trasformazione offre il tempo necessario per riconoscere ciò che si sta affrontando."], "o": false}, {"h": "Obiettivo", "i": ["Imparare a contrastare la forma spaventosa del Molliccio.", "Scegliere un’immagine comica precisa e facile da visualizzare.", "Comprendere che l’incantesimo non cancella i ricordi né ogni paura."], "o": false}], "r": "Riddikulus trasforma la paura in qualcosa di ridicolo.", "l": "Da ricordare", "n": "Presenta Riddikulus come l’incantesimo usato contro il Molliccio. Precisa che non cancella la paura dalla mente e non elimina i ricordi: cambia la forma della creatura e aiuta chi lo usa a reagire in modo diverso."}, {"t": "Riddikulus – Utilizzo", "s": "La trasformazione deve essere concreta e facilmente immaginabile.", "c": [{"h": "Effetto dell’incantesimo", "i": ["Trasforma la forma del Molliccio in qualcosa di divertente, grottesco o meno minaccioso.", "Il riso sincero indebolisce ulteriormente la creatura.", "L’efficacia dipende soprattutto dalla chiarezza dell’immagine mentale."], "o": false}, {"h": "Come scegliere la trasformazione", "i": ["Immaginare un particolare concreto: un cappello sproporzionato, scarpe enormi o un movimento maldestro.", "Evitare idee vaghe: la scena deve essere facile da visualizzare.", "Ricordare che l’incantesimo non elimina ogni paura."], "o": false}], "r": "Un’immagine mentale precisa rende efficace Riddikulus.", "l": "Da ricordare", "n": "Fai esempi di trasformazioni molto visive: scarpe troppo grandi, un cappello ridicolo o un’andatura goffa. Spiega che pensare genericamente a qualcosa di buffo non basta: serve un’immagine precisa. Il riso sincero contribuisce a indebolire il Molliccio."}, {"t": "Riddikulus – Movimento della bacchetta", "s": "Il gesto accompagna la visualizzazione della trasformazione comica.", "c": [{"h": "Sequenza del gesto", "i": ["Puntare la bacchetta verso il Molliccio.", "Eseguire un piccolo semicerchio dal basso verso destra.", "Terminare con uno scatto leggero verso l’alto.", "Pronunciare «Riddikulus!» mentre si visualizza la trasformazione."], "o": true}, {"h": "Concentrazione", "i": ["Evitare gesti concitati.", "Mantenere chiara nella mente la trasformazione scelta.", "È la mente a guidare il mutamento."], "o": false}], "r": "Gesto controllato e immagine mentale precisa lavorano insieme.", "l": "Da ricordare", "n": "Mostra il piccolo semicerchio dal basso verso destra e il leggero scatto finale verso l’alto. Insisti sul fatto che il gesto non deve essere concitato: l’elemento decisivo è la visualizzazione chiara della forma comica."}], "Colloshoo": [{"t": "Colloshoo – Utilizzo", "s": "Incantesimo Incollante", "c": [{"h": "Definizione ed effetto", "i": ["Colloshoo fa aderire al suolo le calzature del bersaglio, ostacolandone il passo.", "In un duello può rallentare un inseguitore o impedire uno spostamento rapido.", "Non blocca le braccia, lo sguardo o la capacità di usare la bacchetta."], "o": false}, {"h": "Limiti e sicurezza", "i": ["L’effetto varia se il terreno è cedevole o se il bersaglio non indossa calzature adatte.", "Non provoca un’immobilizzazione assoluta.", "In aula si prova su una scarpa vuota fissata a una tavoletta."], "o": false}], "r": "Colloshoo limita il movimento, ma non immobilizza completamente il bersaglio.", "l": "Da ricordare", "n": "Spiega che Colloshoo agisce sulle calzature e non sull’intero corpo. Non bisogna quindi immaginare una persona completamente bloccata. Evidenzia il pericolo di un arresto improvviso su scale, passerelle o vicino alle uscite. Per questo l’esercizio scolastico usa una scarpa vuota."}, {"t": "Colloshoo – Movimento della bacchetta", "s": "Il gesto richiama l’idea di fissare la suola al pavimento.", "c": [{"h": "Sequenza del gesto", "i": ["Individuare la base della calzatura.", "Disegnare un piccolo uncino verso il basso.", "Fermare il gesto come per fissare un punto sul terreno.", "Pronunciare «Colloshoo!»."], "o": true}, {"h": "Concentrazione e prudenza", "i": ["Concentrare l’attenzione sul contatto fra suola e pavimento.", "Eseguire il movimento con precisione.", "Non usare la magia su persone che stanno correndo: un arresto improvviso può farle cadere."], "o": false}], "r": "Il piccolo uncino verso il basso rappresenta l’azione di fissaggio.", "l": "Attenzione", "n": "Descrivi il gesto come un piccolo uncino diretto verso il basso. Quando arrivi alla precauzione, spiega perché bloccare all’improvviso una persona in corsa può provocare una caduta. Ricorda che la pratica va svolta su un oggetto di prova."}], "Verdimillus": [{"t": "Verdimillus – Utilizzo", "s": "Lampo di energia verdastra", "c": [{"h": "Definizione ed effetto", "i": ["Verdimillus proietta un breve lampo di energia verdastra.", "Può disturbare un avversario e rendere più chiaro un passaggio in penombra.", "Può mettere in evidenza alcuni elementi nascosti da una magia di occultamento."], "o": false}, {"h": "Limiti e sicurezza", "i": ["Non scioglie necessariamente ogni incantesimo oscuro: un segreto ben protetto può restare celato.", "Una luce troppo intensa può compromettere la vista.", "In aula il bagliore viene indirizzato verso pannelli opachi e spazi oscurati."], "o": false}], "r": "Visibilità, precisione e intensità devono essere sempre controllate.", "l": "Da ricordare", "n": "Spiega che Verdimillus è un lampo utile per illuminare e mettere in evidenza alcuni elementi nascosti, ma non è una soluzione universale contro ogni magia di occultamento. Sottolinea che un bagliore eccessivo può disturbare anche gli alleati."}, {"t": "Verdimillus – Movimento della bacchetta", "s": "Un piccolo arco laterale si conclude puntando in avanti.", "c": [{"h": "Sequenza del gesto", "i": ["Tracciare con la bacchetta un piccolo arco laterale.", "Concludere il movimento puntando in avanti.", "Pronunciare «Verdimillus!» al termine dell’arco."], "o": true}, {"h": "Concentrazione e prudenza", "i": ["Mantenere la mano salda per controllare la direzione del bagliore.", "Un lampo non sostituisce l’esame prudente di una stanza.", "Non entrare in un luogo sospetto soltanto perché un oggetto ha brillato."], "o": false}], "r": "La luce può aiutare a vedere, ma non sostituisce la prudenza.", "l": "Attenzione", "n": "Mostra il piccolo arco laterale e la conclusione in avanti. Spiega la differenza tra rendere visibile un dettaglio e avere la certezza che un luogo sia sicuro. Un oggetto che brilla non è una garanzia: la stanza va comunque esaminata con prudenza."}], "Riepilogo del primo e secondo anno": [{"t": "Riepilogo del percorso", "s": "Le idee essenziali da portare con sé dopo il primo e il secondo anno.", "c": [{"h": "Primo anno", "i": ["Distinguere fatture, malefici e maledizioni.", "Valutare contesto, intenzione e conseguenze.", "Conoscere gli effetti e i movimenti di Rictusempra, Flipendo e Protego."], "o": false}, {"h": "Secondo anno", "i": ["Riconoscere il Molliccio e il ruolo della paura.", "Usare Riddikulus per trasformare la forma minacciosa.", "Comprendere gli effetti e i limiti di Colloshoo e Verdimillus."], "o": false}], "r": "La conoscenza della magia deve sempre accompagnarsi a prudenza e responsabilità.", "l": "Da ricordare", "n": "Concludi chiedendo agli studenti di ricordare non solo il nome degli incantesimi, ma soprattutto la loro funzione, i limiti e le precauzioni. Puoi chiedere loro di distinguere quale incantesimo distrae, quale respinge, quale protegge, quale trasforma, quale aderisce e quale illumina."}], "Come affrontare queste lezioni": [{"t": "Come affrontare queste lezioni", "s": "Osservare, comprendere e scegliere la risposta più prudente.", "c": [{"h": "Metodo di studio", "i": ["Per le creature: riconoscere caratteristiche, habitat, comportamento e segnali di presenza.", "Per gli incantesimi: conoscere formula, categoria, effetto, limiti e movimento della bacchetta.", "In ogni situazione: valutare lo spazio, proteggere il gruppo e chiedere aiuto quando necessario."], "o": false}, {"h": "Obiettivo", "i": ["Non confondere il coraggio con il rischio inutile.", "Non usare la magia per umiliare o controllare gli altri.", "La sicurezza viene prima del confronto."], "o": false}], "r": "La conoscenza serve a prevenire il pericolo, non a cercarlo.", "l": "Da ricordare", "n": "Spiega il metodo comune alle lezioni. Per ogni creatura, gli studenti dovranno imparare a riconoscere segnali e comportamenti senza avvicinarsi inutilmente. Per ogni incantesimo, dovranno saper descrivere l’effetto e soprattutto i suoi limiti. La domanda guida è: quale scelta riduce il rischio per tutti?"}], "I troll": [{"t": "I troll: forza e caratteristiche", "s": "Una creatura potente, territoriale e pericolosa da affrontare senza un piano.", "c": [{"h": "Caratteristiche", "i": ["Il troll è una creatura di enorme forza fisica e temperamento spesso difficile.", "Si distinguono varietà di montagna, di foresta e di fiume: cambiano ambiente e abitudini, ma condividono corporatura massiccia e colpi devastanti.", "L’aspetto goffo può ingannare: un troll può muoversi rapidamente, attraversare una porta in pochi passi e sollevare pesi notevoli.", "Non è ragionevole aspettarsi che reagisca alle parole come farebbe una persona."], "o": false}, {"h": "Segnali di presenza", "i": ["Impronte molto profonde.", "Tronchi abbattuti e rumori di trascinamento.", "Odori forti e danni nell’ambiente.", "Gli indizi vanno considerati insieme: nessuno, da solo, è una prova assoluta."], "o": false}], "r": "La forza del troll rende inutile il coraggio privo di un piano.", "l": "Da ricordare", "n": "Descrivi le varietà di troll e chiarisci che le differenze riguardano soprattutto gli ambienti frequentati e le abitudini. Insisti sul fatto che la goffaggine apparente non equivale a lentezza o innocuità. Chiedi agli studenti quali segnali potrebbero indicare il passaggio di un troll e perché non sia prudente avvicinarsi per verificarli."}, {"t": "I troll: territorio e prudenza", "s": "Riconoscere il pericolo e individuare una via d’uscita prima di agire.", "c": [{"h": "Come comportarsi", "i": ["In un corridoio o in uno spazio stretto, controllare prima le uscite, le porte vicine e gli ostacoli che potrebbero rallentare la fuga.", "Non avvicinarsi soltanto per confermare un sospetto: il rischio raramente vale la scoperta.", "Non provocare il troll con luci improvvise, colpi inutili o oggetti lanciati.", "Evitare incantesimi esplosivi vicino a pareti portanti o strutture che potrebbero cedere."], "o": false}, {"h": "Difesa e assistenza", "i": ["Proteggere le persone e cercare un passaggio sicuro è più importante che costringere la creatura a indietreggiare.", "Non separarsi dal gruppo e non sostare sotto strutture instabili.", "Segnalare il pericolo e seguire le indicazioni dei docenti.", "I casi gravi richiedono professionisti addestrati nella gestione delle creature magiche."], "o": false}], "r": "Un troll non è un bersaglio di esercitazione: la lezione insegna a evitare lo scontro.", "l": "Da ricordare", "n": "Usa l’esempio di un corridoio stretto: prima di qualsiasi azione occorre individuare le vie d’uscita e gli ostacoli. Spiega perché provocare il troll o usare magie esplosive può peggiorare la situazione. Se una persona cade, l’aiuto va prestato senza tagliare la strada alla creatura e senza creare una seconda vittima. Il compito degli studenti è segnalare e seguire le istruzioni, non affrontare il troll."}], "Tarantallegra": [{"t": "Tarantallegra – Incantesimo Danzante", "s": "Anno III · Fattura", "c": [{"h": "Utilizzo ed effetto", "i": ["Tarantallegra costringe il bersaglio a muovere rapidamente le gambe, come in una danza incontrollabile.", "Non è una coreografia volontaria: il movimento nasce da una costrizione magica.", "Nel duello il bersaglio perde stabilità, fatica a mantenere la posizione e può interrompere la preparazione di un incantesimo.", "L’effetto è particolarmente pericoloso su scale, balconi e pavimenti sconnessi."], "o": false}, {"h": "Movimento della bacchetta", "i": ["Puntare la bacchetta verso le gambe del bersaglio.", "Disegnare due brevi oscillazioni alternate: una a destra e una a sinistra.", "Concludere pronunciando «Tarantallegra!»", "Il gesto deve avere ritmo, senza diventare un ampio mulinello."], "o": true}], "r": "Un incantesimo che impone movimenti va interrotto se il bersaglio perde l’equilibrio.", "l": "Da ricordare", "n": "Spiega la differenza tra una danza volontaria e un movimento imposto dalla magia. Chiarisci che la fattura può avere un’utilità tattica perché compromette la stabilità, ma non deve essere usata per deridere qualcuno. Fai notare i rischi di scale, balconi e superfici irregolari. Mostra lentamente le due oscillazioni alternate e la pronuncia della formula."}], "Expelliarmus": [{"t": "Expelliarmus – Incantesimo di Disarmo", "s": "Anno III · Incantesimo offensivo", "c": [{"h": "Utilizzo ed effetto", "i": ["Expelliarmus mira a far lasciare al bersaglio la bacchetta o l’oggetto che impugna.", "Può interrompere un attacco imminente e costringere l’avversario a cercare un’altra soluzione.", "Il risultato dipende da distanza, presa, concentrazione e ostacoli: il disarmo non è sempre assicurato.", "Il bersaglio può ancora muoversi, parlare o tentare altre azioni: disarmare non mette automaticamente in sicurezza il luogo."], "o": false}, {"h": "Movimento della bacchetta", "i": ["Sollevare la bacchetta verso la mano armata del bersaglio.", "Eseguire un breve scatto diagonale verso l’alto, come per liberare un oggetto dalla presa.", "Pronunciare «Expelliarmus!» al termine del gesto.", "Mirare alla bacchetta, non al volto, quando è sufficiente."], "o": true}], "r": "La riuscita si misura dal disarmo e dal controllo della situazione, non dalla violenza del lancio.", "l": "Da ricordare", "n": "Sottolinea che Expelliarmus interrompe un attacco togliendo l’oggetto impugnato, ma non rende innocuo l’avversario. Invita a osservare dove cade la bacchetta: non deve finire nel fuoco, vicino a un precipizio o nelle mani di chi potrebbe usarla impropriamente. Mostra lo scatto diagonale verso l’alto e la pronuncia."}], "Evertestatum": [{"t": "Evertestatum – Incantesimo di Dispersione", "s": "Anno III · Schiantesimo", "c": [{"h": "Utilizzo ed effetto", "i": ["Evertestatum proietta una forza che può far inciampare o scaraventare all’indietro il bersaglio.", "Rispetto a Flipendo, l’effetto è più brusco e la perdita di equilibrio meno graduale.", "Può offrire una possibilità di fuga, ma la caduta può provocare lesioni e urti.", "La riuscita va valutata anche in base al punto d’arrivo del bersaglio, non soltanto alla distanza percorsa."], "o": false}, {"h": "Movimento e sicurezza", "i": ["Tracciare una linea breve in diagonale dal basso verso l’alto.", "Aggiungere una spinta in avanti della punta.", "Pronunciare «Evertestatum!» in un solo tempo deciso.", "Evitare vetri, parapetti, pareti fragili e luoghi affollati."], "o": false}], "r": "Quando possibile, in un luogo affollato è preferibile una difesa meno invasiva.", "l": "Da ricordare", "n": "Confronta Evertestatum con Flipendo: entrambi possono spostare il bersaglio, ma qui l’effetto è descritto come più brusco e può provocare una caduta. Chiedi agli studenti di valutare il punto d’arrivo e gli ostacoli. Segnala che la formula viene mantenuta come «Evertestatum» secondo la nomenclatura del corso, pur incontrando nei repertori la grafia «Everte Statum»."}], "I licantropi": [{"t": "I licantropi: una condizione, non una scelta", "s": "Conoscere la trasformazione e riconoscere il pericolo rispettando la persona.", "c": [{"h": "La licantropia", "i": ["La licantropia è una condizione magica che può essere trasmessa dal morso di un lupo mannaro durante la trasformazione.", "Per la maggior parte del tempo la persona conserva aspetto umano, memoria e relazioni.", "Il rischio maggiore si manifesta durante la luna piena, quando la trasformazione comporta spesso la perdita del normale controllo delle azioni.", "È importante distinguere la persona, che possiede diritti e dignità, dall’emergenza concreta della trasformazione."], "o": false}, {"h": "Pregiudizi e segnali", "i": ["Paura e racconti popolari hanno prodotto accuse ingiuste e isolamento.", "Non esiste un segno fisico semplice che identifichi con certezza un licantropo in forma umana.", "Stanchezza, cicatrici o riservatezza possono avere molte spiegazioni.", "La sicurezza si basa su circostanze e rischi concreti, non su sospetti."], "o": false}], "r": "La conoscenza protegge dal pericolo e dai pregiudizi verso la persona.", "l": "Da ricordare", "n": "Apri la lezione chiedendo agli studenti di distinguere una condizione magica dalla responsabilità morale della persona che ne è affetta. Spiega la trasmissione e il ciclo della luna piena secondo il materiale del corso. Insisti sul fatto che caratteristiche generiche come stanchezza o cicatrici non sono prove e non giustificano accuse."}, {"t": "I licantropi: luna piena ed emergenza", "s": "La prevenzione e l’organizzazione contano più della reazione improvvisata.", "c": [{"h": "Prevenire il rischio", "i": ["Il ciclo lunare permette di prevedere il momento in cui la trasformazione diventa un pericolo.", "Un luogo protetto, scelto con attenzione, può evitare incontri accidentali.", "In caso di trasformazione inattesa, non tentare di discutere, trattenere la creatura con le mani o restare vicino per dimostrare coraggio.", "Gli incantesimi comuni non costituiscono una garanzia contro l’aggressività dell’essere trasformato."], "o": false}, {"h": "In caso di emergenza", "i": ["Allontanarsi in gruppo e non separarsi.", "Evitare spazi chiusi senza uscita.", "Avvisare immediatamente il personale competente.", "Se possibile senza esporsi, indicare un riparo e mantenere liberi i passaggi.", "Soccorritori e guaritori valutano ferite e misure necessarie."], "o": false}], "r": "Nel 1890 non si deve presumere l’esistenza di una pozione comune che cancelli i rischi mentali della trasformazione.", "l": "Da ricordare", "n": "Spiega che conoscere il ciclo lunare consente di pianificare la prevenzione. In caso di emergenza, la priorità è allontanarsi in gruppo e avvisare il personale competente. Non si deve tentare un contenimento fisico improvvisato. Richiama esplicitamente il riferimento temporale del materiale: nel 1890 le possibilità di prevenire gli effetti mentali della trasformazione sono limitate."}], "Le Acromantule": [{"t": "Le Acromantule: caratteristiche e territorio", "s": "Intelligenza, veleno e comportamento di una creatura da non sottovalutare.", "c": [{"h": "Caratteristiche", "i": ["L’Acromantula è un enorme ragno magico, dotato di linguaggio e capacità di ragionamento.", "Le sue origini sono generalmente collocate nelle regioni tropicali del Sud-est asiatico.", "Corpo scuro, numerosi occhi, zampe lunghe e mandibole possenti alimentano leggende, ma i pericoli principali sono rapidità e veleno.", "La capacità di parlare non significa che segua le stesse regole sociali di un essere umano."], "o": false}, {"h": "Tracce di una colonia", "i": ["Le Acromantule possono vivere in colonie e comportarsi in modo coordinato.", "Reti estese e fili robusti fra gli alberi.", "Resti di prede e vibrazioni insolite.", "Davanti a questi segnali, tornare indietro senza scuotere o rompere le trame."], "o": false}], "r": "Una creatura che sa parlare non è automaticamente amichevole.", "l": "Da ricordare", "n": "Descrivi l’Acromantula come creatura intelligente e capace di linguaggio, ma chiarisci che questo non garantisce una trattativa sicura. Spiega i segnali di una colonia e perché non bisogna avvicinarsi per curiosità. Invita gli studenti a riconoscere le tracce senza trasformare l’osservazione in un’esplorazione rischiosa."}, {"t": "Le Acromantule: veleno e incontro", "s": "La buona difesa consiste nel ridurre l’esposizione e mantenere una via di ritirata.", "c": [{"h": "Veleno e rischi", "i": ["Le mandibole sono una minaccia diretta; anche un movimento difensivo può essere pericoloso per la grande dimensione dell’animale.", "Una ferita sospetta deve essere affidata immediatamente a guaritori esperti.", "Non improvvisare rimedi, non raccogliere veleno e non catturare esemplari.", "Il materiale biologico destinato agli speziali va trattato soltanto da personale qualificato."], "o": false}, {"h": "Se l’incontro è inevitabile", "i": ["Mantenere una via di ritirata ed evitare provocazioni.", "Non avvicinarsi a nidi o uova.", "Se la colonia accerchia il gruppo, allontanare chi è più vulnerabile e chiedere aiuto.", "Luci ed esplosioni possono irritare gli animali o causare altri pericoli."], "o": false}], "r": "Una creatura pericolosa non è automaticamente malvagia; la prudenza resta indispensabile.", "l": "Da ricordare", "n": "Spiega che il veleno e le mandibole rendono pericoloso ogni avvicinamento. Una ferita va affidata a guaritori esperti: non si improvvisano rimedi né si raccoglie veleno. Fai ragionare la classe sull’effetto collaterale di una luce intensa o di un’esplosione vicino a una colonia: la difesa deve essere valutata per le sue conseguenze."}], "Confundo": [{"t": "Confundo – Incantesimo Confundus", "s": "Anno IV · Fattura", "c": [{"h": "Utilizzo ed effetto", "i": ["Confundo altera temporaneamente l’attenzione e il giudizio del bersaglio.", "Può indurre a scegliere in modo errato, dimenticare un compito o interpretare male una situazione.", "Non conferisce un potere assoluto sulla volontà altrui e si distingue dalle magie di controllo più gravi.", "In un duello può offrire pochi istanti di vantaggio; usarlo in accordi, esami o decisioni personali viola la fiducia."], "o": false}, {"h": "Movimento della bacchetta", "i": ["Disegnare una piccola spirale verso l’interno.", "Terminare con la punta rivolta al bersaglio.", "Pronunciare «Confundo!» con tono fermo.", "Concentrarsi su un breve smarrimento dell’attenzione, non su un danno fisico."], "o": true}], "r": "Confondere la mente per ottenere un consenso non è persuasione: è una violazione della fiducia.", "l": "Da ricordare", "n": "Spiega che Confundo altera temporaneamente attenzione e giudizio, ma non equivale a un controllo assoluto della volontà. Distingui l’uso tattico in un duello dalla manipolazione di decisioni personali, accordi o esami. Aggiungi che è importante riconoscere un comportamento disorientato e avvisare chi può valutare l’effetto. Mostra la piccola spirale verso l’interno."}], "Petrificus": [{"t": "Petrificus – Incantesimo Pietrificante", "s": "Anno IV · Fattura", "c": [{"h": "Utilizzo ed effetto", "i": ["Petrificus irrigidisce il corpo del bersaglio e ne limita o impedisce i movimenti.", "La durata dipende dalla forza e dalla riuscita dell’incantesimo.", "Può interrompere un’aggressione, ma lasciare la persona incapace di proteggersi da una caduta o da altri pericoli.", "Il bersaglio non perde necessariamente conoscenza o sensibilità: usarlo come scherzo è particolarmente crudele.", "Anche la rapidità con cui l’effetto viene sciolto è importante, soprattutto se la persona è in una posizione scomoda."], "o": false}, {"h": "Movimento e assistenza", "i": ["Tenere la punta rivolta al centro del bersaglio.", "Tracciare una linea verticale dall’alto verso il basso.", "Chiudere con un brevissimo arresto del polso.", "Pronunciare «Petrificus!» con precisione.", "Visualizzare l’arresto dei movimenti, non un aumento della pressione fisica."], "o": false}], "r": "Una persona immobilizzata necessita di protezione: lasciarla in pericolo può essere più grave dell’incantesimo.", "l": "Da ricordare", "n": "Presenta Petrificus come una fattura che limita i movimenti, non come una perdita automatica di coscienza. Chiarisci che immobilizzare qualcuno può esporlo a cadute o ad altri rischi ambientali. L’intervento non termina con il lancio dell’incantesimo: occorre controllare il luogo, proteggere il bersaglio e far intervenire un adulto competente. Mostra il movimento verticale e il breve arresto finale."}], "Riepilogo del terzo e quarto anno": [{"t": "Riepilogo del terzo e quarto anno", "s": "Le conoscenze essenziali da portare con sé dopo il percorso.", "c": [{"h": "Terzo anno", "i": ["Troll: forza, territorio, segnali di presenza e vie di fuga.", "Tarantallegra: movimento incontrollato delle gambe e perdita di equilibrio.", "Expelliarmus: disarmo, senza presumere che il pericolo sia finito.", "Evertestatum: dispersione brusca e rischio di caduta."], "o": false}, {"h": "Quarto anno", "i": ["Licantropi: trasformazione, prevenzione e rispetto della persona.", "Acromantule: colonie, veleno e gestione prudente dell’incontro.", "Confundo: alterazione temporanea dell’attenzione e del giudizio.", "Petrificus: immobilizzazione e necessità di proteggere il bersaglio."], "o": false}], "r": "Conoscere l’effetto non basta: bisogna comprenderne limiti, rischi e conseguenze.", "l": "Da ricordare", "n": "Concludi chiedendo agli studenti di distinguere le creature dagli incantesimi e di ricordare per ciascuno il rischio principale. Puoi domandare quale sia la prima scelta davanti a un troll, quali indizi suggeriscano una colonia di Acromantule e perché disarmare o immobilizzare non equivalga a rendere sicura una situazione."}]};
const G=[["Fattura","Magia che cambia per poco il comportamento o la condizione di qualcuno: fa ridere, ballare, confondere."],["Maleficio","Magia che ostacola o danneggia: blocca i movimenti o rende il luogo ostile."],["Maledizione","La magia ostile più grave: causa sofferenza e i suoi effetti sono difficili da togliere."],["Schiantesimo","Colpo magico che scaraventa o fa cadere il bersaglio. Può far male: occhio a dove cade."],["Incantesimo difensivo","Magia che serve a proteggersi, come lo scudo di Protego."],["Molliccio","Creatura che prende la forma della tua paura. Si nasconde in armadi e ripostigli."],["Licantropo","Persona che si trasforma in lupo a luna piena. Va rispettata: il pericolo è la trasformazione."],["Acromantula","Ragno gigante magico che parla e vive in colonie. Il suo veleno è pericoloso."],["Troll","Creatura enorme e forte, territoriale. Si evita, non si affronta."]];
const Y=["","Primo anno","Secondo anno","Terzo anno","Quarto anno"],R=["","I","II","III","IV"];
const YD=["","Categorie di magia ostile e primi incantesimi di base.","Creature, consapevolezza emotiva e incantesimi di contrasto.","Riconoscimento dei rischi e incantesimi di disarmo e dispersione.","Licantropia, Acromantule e incantesimi che alterano o limitano."];
const K={"Fattura, maleficio e maledizione":"Teoria","La scelta più importante":"Teoria","Rictusempra":"Fattura","Flipendo":"Maleficio","Protego":"Incantesimo difensivo","Il Molliccio":"Creatura","Riddikulus":"Incantesimo","Colloshoo":"Incantesimo","Verdimillus":"Incantesimo","I troll":"Creatura","Tarantallegra":"Fattura","Expelliarmus":"Incantesimo di disarmo","Evertestatum":"Schiantesimo","I licantropi":"Creatura","Le Acromantule":"Creatura","Confundo":"Fattura","Petrificus":"Fattura","Come affrontare queste lezioni":"Teoria","Riepilogo del primo e secondo anno":"Teoria","Riepilogo del terzo e quarto anno":"Teoria"};
const C={Fattura:"f",Maleficio:"m",Schiantesimo:"s","Incantesimo difensivo":"d","Incantesimo di disarmo":"i",Incantesimo:"i",Creatura:"c",Teoria:"t"};
const ORD=Object.keys(C);
const L=D.map((a,i)=>({id:i+1,y:a[0],t:a[1],s:a[2],pg:P[a[1]]||[],p:a[3].length?a[3]:(P[a[1]]||[]).flatMap(g=>g.c.flatMap(c=>c.i)),g:a[4],r:a[5],n:a[6],q:a[7],k:K[a[1]]||"Teoria",x:X[a[1]]||["","","",""]}));
const $=s=>document.querySelector(s),app=$("#app"),li=x=>`<li>${x}</li>`;
const tag=k=>`<span class="tag ${C[k]}">${k}</span>`;
const card=l=>`<a class="lc" href="#l${l.id}">${tag(l.k)}<b>${l.t}</b><span>${l.s}</span></a>`;
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let notes=true,Q=null,S="",cur=location.hash.slice(1);
function go(h){cur=h;try{history.pushState(null,"","#"+h)}catch(e){}route()}
const nq=L.reduce((n,l)=>n+l.q.length,0);

function home(){
  app.innerHTML=`<div class="hero"><i>✦</i><span class="lab">Archivio didattico · Area riservata ai docenti</span><h1>Difesa contro<br>le Arti Oscure</h1><p>Un ambiente di lavoro per organizzare programmi, lezioni, creature, incantesimi e materiali didattici. Scegli un anno, spiega la lezione e mettila alla prova con le domande.</p></div>
  <div class="stats"><div class="stat"><b>4</b><span>Anni sviluppati</span></div><div class="stat"><b>${L.length}</b><span>Schede lezione</span></div><div class="stat"><b>${nq}</b><span>Domande pronte</span></div><div class="stat"><b>${L.filter(l=>l.k=="Creatura").length}</b><span>Creature</span></div></div>
  <h2 class="sec">Programmi scolastici</h2><p class="sub">Seleziona un anno per consultare le lezioni.</p>
  <div class="g2">${[1,2,3,4].map(y=>`<a class="yc" href="#y${y}"><em>${R[y]}</em><b>${Y[y]}</b><p>${YD[y]}</p><span class="more">${L.filter(l=>l.y==y).length} lezioni disponibili ↗</span></a>`).join("")}</div>
  <h2 class="sec">Domande</h2><p class="sub">Scegli la lezione che stai facendo e interroga la classe.</p>
  <a class="btn pri" href="#q">Vai alle domande</a>`;
}
function year(y){
  app.innerHTML=`<div class="hero"><span class="lab">Programma scolastico</span><h1>${Y[y]}</h1><p>${YD[y]}</p></div><div class="g3" style="margin-top:2rem">${L.filter(l=>l.y==y).map(card).join("")}</div><p style="margin-top:2rem"><a class="btn pri" href="#q">Domande su questo anno</a></p>`;
}
function enc(){
  app.innerHTML=`<div class="hero"><span class="lab">Enciclopedia DCAO</span><h1>Incantesimi e creature</h1><p>Ogni scheda è classificata per tipo: fattura, maleficio, schiantesimo, incantesimo difensivo, creatura.</p></div>`+
  ORD.map(k=>{const ls=L.filter(l=>l.k==k);return ls.length?`<h2 class="sec">${tag(k)}</h2><p class="sub">${ls.length} ${ls.length>1?"schede":"scheda"}</p><div class="g3">${ls.map(card).join("")}</div>`:""}).join("");
}
function all(){
  const s=S.toLowerCase(),ls=L.filter(l=>!s||(l.t+l.s+l.k+l.x[0]+l.p.join(" ")).toLowerCase().includes(s));
  app.innerHTML=`<div class="hero"><span class="lab">Consultazione</span><h1>Tutte le lezioni</h1><p>${s?`Risultati per «${S}»: ${ls.length}`:`${L.length} schede, dal primo al quarto anno.`}</p></div><div class="g3" style="margin-top:2rem">${ls.map(card).join("")||"<p>Nessuna lezione trovata.</p>"}</div>`;
}
function lesson(id){
  const l=L[id-1]; if(!l) return home();
  const pr=L[id-2],nx=L[id];
  app.innerHTML=`<article class="les"><span class="lab" style="color:var(--gold)">${Y[l.y]}</span><h1>${l.t}</h1><p class="sub" style="margin:0">${l.s}</p>${tag(l.k)}
  <div class="tools"><button id="cp">Copia per Discord</button><a class="btn pri" href="#q${l.id}">Fai le domande</a></div>
  ${l.x[0]?`<h2>Che cos’è</h2><p>${l.x[0]}</p><div class="ex"><b>Esempio</b>${l.x[1]}</div>`:""}
  ${l.pg.map(g=>`<section class="pg"><h2>${g.t}</h2>${g.s?`<p class="sub">${g.s}</p>`:""}${g.c.map(c=>`<h3>${c.h}</h3>${c.o?"<ol>":"<ul>"}${c.i.map(li).join("")}${c.o?"</ol>":"</ul>"}`).join("")}${g.r?`<blockquote><b>${g.l}</b>${g.r}</blockquote>`:""}</section>`).join("")}
  ${l.x[0]?`<div class="ex warn"><b>Attenzione</b>${l.x[2]}</div><h2>Prova in classe</h2><p>${l.x[3]}</p>`:""}
  ${notes?`<div class="note"><h2>Traccia del docente</h2>${l.pg.filter(g=>g.n).map(g=>`<p><b>${g.t}.</b> ${g.n}</p>`).join("")}</div>`:""}
  <nav class="pn" aria-label="Lezioni">${pr?`<a href="#l${pr.id}">‹ ${pr.t}</a>`:"<span></span>"}${nx?`<a href="#l${nx.id}">${nx.t} ›</a>`:""}</nav></article>`;
  $("#cp").onclick=async function(){
    const t=`**${l.t}** (${l.k}) — ${l.s}\n`+l.p.map(x=>"• "+x).join("\n")+(l.g?"\n\n**Movimento della bacchetta**\n"+l.g.map((x,i)=>`${i+1}. ${x}`).join("\n"):"")+`\n\n> ${l.r}`;
    try{await navigator.clipboard.writeText(t);this.textContent="Copiato"}catch(e){this.textContent="Copia non riuscita"}
    setTimeout(()=>this.textContent="Copia per Discord",1800);
  };
}
function quizHome(){
  app.innerHTML=`<div class="hero"><span class="lab">Domande</span><h1>Interroga la classe</h1><p>Scegli la lezione che stai facendo: le domande escono in ordine casuale e dopo ogni risposta la soluzione viene evidenziata.</p></div>`+
  `<div class="qy" style="margin-top:2rem"><button class="pri" data-q="all">Tutte le lezioni (${nq} domande)</button></div>`+
  [1,2,3,4].map(y=>`<h2 class="sec">${Y[y]}</h2><div class="qy"><button class="pri" data-q="y${y}">Tutto l’anno</button>${L.filter(l=>l.y==y).map(l=>`<button data-q="${l.id}">${l.t}</button>`).join("")}</div>`).join("");
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>startQ(b.dataset.q));
}
function startQ(v){
  const ls=v=="all"?L:v[0]=="y"?L.filter(l=>l.y==v.slice(1)):[L[v-1]];
  if(!ls[0]) return quizHome();
  Q={qs:sh(ls.flatMap(l=>l.q.map(q=>[l.t,...q]))),i:0,s:0};
  ask();
}
function ask(){
  if(Q.i>=Q.qs.length){
    app.innerHTML=`<div class="card"><span class="lab" style="color:var(--gold)">Fine</span><h2>Risposte esatte: ${Q.s} su ${Q.qs.length}</h2><button id="again">Ripeti</button> <a class="btn" href="#q">Scegli un’altra lezione</a></div>`;
    $("#again").onclick=()=>{Q.qs=sh(Q.qs);Q.i=0;Q.s=0;ask()};
    return;
  }
  const q=Q.qs[Q.i],o=sh([[q[2],1],[q[3],0],[q[4],0]]);
  app.innerHTML=`<div class="card"><p class="prog">Domanda ${Q.i+1} di ${Q.qs.length} · ${q[0]}</p><h2>${q[1]}</h2><div class="opts">${o.map(x=>`<button class="opt" data-ok="${x[1]}">${x[0]}</button>`).join("")}</div><p id="fb" aria-live="polite"></p><button id="nx" hidden>${Q.i+1==Q.qs.length?"Vedi il risultato":"Avanti"}</button> <a class="btn" href="#q">Cambia lezione</a></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok=b.dataset.ok=="1";
    document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok=="1")x.classList.add("ok")});
    if(!ok)b.classList.add("no"); else Q.s++;
    $("#fb").textContent=ok?"Esatto.":"Non esatto: la risposta giusta è evidenziata.";
    $("#nx").hidden=false;$("#nx").focus();
  });
  $("#nx").onclick=()=>{Q.i++;ask()};
}
function guide(){
  const ls=L.filter(l=>l.k!="Creatura"&&l.k!="Teoria").sort((a,b)=>a.t.localeCompare(b.t));
  app.innerHTML=`<div class="hero"><span class="lab">Guida rapida</span><h1>Tutti gli incantesimi</h1><p>In ordine alfabetico, con tipo e formula da pronunciare.</p></div><div class="g3" style="margin-top:2rem">${ls.map(l=>`<a class="lc" href="#l${l.id}">${tag(l.k)}<b>${l.t}</b><span>Formula: «${l.t}!» · ${Y[l.y]}</span></a>`).join("")}</div>`;
}
function gloss(){
  app.innerHTML=`<div class="hero"><span class="lab">Glossario</span><h1>Parole da conoscere</h1><p>Spiegate in modo semplice, da usare a voce in classe.</p></div><div class="g2" style="margin-top:2rem">${G.map(g=>`<div class="stat"><b style="font-size:1.4rem">${g[0]}</b><p style="margin:.4rem 0 0">${g[1]}</p></div>`).join("")}</div>`;
}
function route(){
  const h=cur,c=h[0]||"",n=+h.slice(c=="y"||c=="l"?1:99);
  document.body.classList.remove("open");
  let cr="Portale docenti / Dashboard",nav="#";
  if(c=="l"&&L[n-1]){cr=`Portale docenti / ${Y[L[n-1].y]} / ${L[n-1].t}`;nav="#y"+L[n-1].y;lesson(n)}
  else if(c=="y"&&Y[n]){cr="Portale docenti / "+Y[n];nav=h;year(n)}
  else if(h=="enc"){cr="Portale docenti / Enciclopedia";nav=h;enc()}
  else if(h=="all"){cr="Portale docenti / Tutte le lezioni";nav=h;all()}
  else if(h=="guida"){cr="Portale docenti / Guida rapida";nav=h;guide()}
  else if(h=="gloss"){cr="Portale docenti / Glossario";nav=h;gloss()}
  else if(c=="q"){cr="Portale docenti / Domande";nav="#q";h.length>1?startQ(h.slice(1)):quizHome()}
  else home();
  $("#crumb").textContent=cr;
  document.querySelectorAll("#sb a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==(nav=="#"?"#":nav.startsWith("#")?nav:"#"+nav)));
  window.scrollTo(0,0);
}
$("#nt").onclick=()=>{notes=!notes;$("#nt").textContent="Note docente: "+(notes?"sì":"no");route()};
$("#mb").onclick=()=>document.body.classList.toggle("open");
$("#se").oninput=e=>{S=e.target.value;cur!="all"?go("all"):all()};
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute("href").slice(1))});
addEventListener("popstate",()=>{cur=location.hash.slice(1);route()});route();
</script>
</body>
</html>
